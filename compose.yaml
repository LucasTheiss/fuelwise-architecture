services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fuelwise
      POSTGRES_USER: fuelwise
      POSTGRES_PASSWORD: fuelwise_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fuelwise_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuelwise -d fuelwise"]
      interval: 5s
      timeout: 3s
      retries: 10
  init:
    build: .
    restart: "no"
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed:admin"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fuelwise:fuelwise_dev@db:5432/fuelwise
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fuelwise:fuelwise_dev@db:5432/fuelwise
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      init:
        condition: service_completed_successfully
volumes:
  fuelwise_pg:
