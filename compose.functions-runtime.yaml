# Local-only overlay. Secrets are generated by scripts/prepare-function-runtime.mjs.
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    environment:
      AZURITE_ACCOUNTS: devstoreaccount1:${LOCAL_STORAGE_KEY:?run prepare-function-runtime.mjs}
  function:
    build:
      context: projects/fuelwise-azure-function
      dockerfile: Dockerfile.runtime
    environment:
      AzureWebJobsSecretStorageType: files
      FUNCTIONS_SECRETS_PATH: /home/site/secrets
      AzureWebJobsStorage: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=${LOCAL_STORAGE_KEY};BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
    depends_on: [azurite]
    volumes:
      - ./tmp/function-secrets:/home/site/secrets
    ports:
      - "127.0.0.1:7071:80"
  bff:
    environment:
      FUNCTION_URL: http://function:80/api/indicators
      FUNCTION_KEY: ${FUNCTION_KEY:?run prepare-function-runtime.mjs and add --env-file .env.function-runtime}
